<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sign in and Sign up</title>

    <link rel="stylesheet" href="styles.css">
</head>
<body>
 
    <div class="container">
    <div class="forms-container">
    <div class="signin-signup">
        <form action="custdash.html" method="GET" class="sign-in-form">

    <div class="title-container">
        <h2 class="title">Sign in to Donut Shop</h2>
            
 </div>
    <div class="input-field">
        <img src="toppurpledonut.png">
            <input type="text" id="login-username" placeholder="Username" required>
        </div>
        <div class="input-field">
            <img src="toppinkdonut.png">
            <input type="password" id="login-password" placeholder="Password" required>
</div>
            <input type="submit" value="Login" class="btn solid">
        </form>


    <form action="" method="GET" class="sign-up-form">
    <div class="title-container">
        <h2 class="title">Sign up for Sweet Donuts!</h2>

</div>

    <div class="input-field">
        <img src="toppinkdonut.png">
            <input type="text" id="signup-username" placeholder="Email" required>
</div>
    <div class="input-field">
        <img src="topmagentadonut.png">
            <input type="password" id="signup-password" placeholder="Password" required>
</div>
            <input type="submit" value="Sign up" class="btn solid">
        </form>
</div>
</div>


    <div class="panels-container">
    <div class="panel left-panel">
    <div class="content">
        <h3>New customer?</h3>
            <p>Sign up to join the Donut shop rewards!</p>
            <button class="btn transparent" id="sign-up-btn" type="button">Sign Up!</button>
</div>
        <img src="purpledonut.png" class="image" >
</div>
    <div class="panel right-panel">
    <div class="content">
        <h3>Already a Member?</h3>
            <p>Sign in to join and start ordering off our menu!</p>
            <button class="btn transparent2" id="sign-in-btn" type="button">Sign in</button>
</div>
            <img src="pinkdonut.png" class="image" >

        </div>
    </div>
</div>

    <script src="script.js"></script>
</body>
</html>
